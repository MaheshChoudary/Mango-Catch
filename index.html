<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chess World</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{--bg:#faf6ec;--fg:#1d2433;--card:#fff;--pri:#14213d;--prt:#faf6ec;--gold:#b8933f;--gr:#4f7f5a;--mut:#6b7080;--bd:#e3dac3;--l:#f0d9b5;--d:#b58863;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1726;--fg:#f1ede2;--card:#18233a;--pri:#d9b862;--prt:#14213d;--gold:#d9b862;--gr:#7fb08a;--mut:#9aa3b8;--bd:#2a3752}}
:root[data-theme="dark"]{--bg:#0f1726;--fg:#f1ede2;--card:#18233a;--pri:#d9b862;--prt:#14213d;--gold:#d9b862;--gr:#7fb08a;--mut:#9aa3b8;--bd:#2a3752}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1}h2{font-size:1.5rem;margin-top:1.6em}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
#back{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:10px;padding:6px 12px;font-weight:600;cursor:pointer}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem;letter-spacing:.5px;cursor:pointer}.lg{width:32px;height:32px}
#nav{display:flex;gap:4px;flex:1;flex-wrap:wrap;justify-content:center}
#nav button{background:none;border:0;color:var(--mut);padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer}#nav button.on{background:var(--pri);color:var(--prt)}
#hud{font-size:.85rem;color:var(--mut);font-weight:600}#tm{background:none;border:1px solid var(--bd);border-radius:50%;width:34px;height:34px;color:var(--fg);cursor:pointer}
main{max-width:1000px;margin:auto;padding:16px}
button.b{background:var(--pri);color:var(--prt);border:0;border-radius:10px;padding:11px 22px;font-weight:700;font-size:1rem;cursor:pointer;margin:4px 8px 4px 0}button.b.o{background:none;color:var(--fg);border:2px solid var(--pri)}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer}button.s.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
button.lk{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;font:inherit;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px #0002}.card small,.mut{color:var(--mut)}.card.lock{opacity:.5;cursor:default}.em{font-size:2rem;line-height:1.2}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bd);color:var(--fg);width:max-content}.badge.g{background:var(--gr);color:#fff}.badge.y{background:var(--gold);color:#fff}
.hero{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:14px 0}.hero>div{flex:1 1 320px}
.board{width:max(260px,min(94vw,calc(100dvh - 260px),520px));aspect-ratio:1;display:grid;grid-template:repeat(8,minmax(0,1fr))/repeat(8,minmax(0,1fr));container-type:size;border:3px solid var(--pri);border-radius:6px;overflow:hidden;margin:8px auto}
.board.sm{width:min(86vw,360px)}
.sq{position:relative;aspect-ratio:1;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.l{background:var(--l)}.d{background:var(--d)}.pc{font-size:9.2cqw;line-height:1}
.pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 1px #000}.pc.b{color:#161616;text-shadow:0 0 2px #fff9}
.rk,.fl{position:absolute;font-size:2.4cqw;font-style:normal;font-weight:700;opacity:.65;pointer-events:none}.rk{top:3%;left:5%}.fl{bottom:3%;right:5%}
.last{background-image:linear-gradient(#f2d34f77,#f2d34f77)}.sel{box-shadow:inset 0 0 0 .6cqw #e9b824}.chk{background-image:radial-gradient(#e33,transparent 75%)}
.tg::after{content:"";position:absolute;width:3.6cqw;height:3.6cqw;border-radius:50%;background:#0005}.star::before{content:"★";position:absolute;font-size:6cqw;color:#e9b824;text-shadow:0 0 3px #000;z-index:1;opacity:.95}
.coach{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;margin:8px auto;max-width:520px;min-height:48px}
.coach.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.9);box-shadow:0 0 0 0 var(--gold)}60%{transform:scale(1.04)}100%{transform:scale(1);box-shadow:0 0 0 12px transparent}}
.warn{max-width:520px;margin:4px auto;font-size:.9rem;color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.mv{max-width:520px;margin:6px auto;font-size:.85rem;color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:10px 0}
.lb{aspect-ratio:1;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font:700 1.2rem Georgia,serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lb small{font:.65rem system-ui;color:var(--gold)}.lb.done{border-color:var(--gr);background:var(--gr);color:#fff}.lb.done small{color:#fff}.lb.cur{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}.lb.lock{opacity:.4;cursor:default}
.tile{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}.tile b{display:block;font:700 1.6rem Georgia,serif}.tile span{color:var(--mut);font-size:.8rem}
.av{width:72px;height:72px;border-radius:50%;background:var(--pri);color:var(--prt);display:flex;align-items:center;justify-content:center;font:700 2rem Georgia,serif}
.ph{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}
input,select{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}
.dots::after{content:"";animation:d 1s steps(4) infinite}@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
footer{text-align:center;color:var(--mut);padding:30px 0;font-size:.85rem}
</style></head><body>
<header><button id="back" onclick="back()" hidden>← Back</button>
<span class="brand" onclick="go(showHome)"><svg class="lg" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="var(--pri)"/><rect x="20" y="0" width="10" height="10" fill="var(--gold)" opacity=".35"/><rect x="30" y="10" width="10" height="10" fill="var(--gold)" opacity=".35"/><text x="20" y="31" font-size="27" text-anchor="middle" fill="var(--prt)">♞</text></svg>CHESS WORLD</span>
<nav id="nav"></nav><span id="hud"></span><button id="tm" onclick="tmode()" title="Light / dark">◐</button></header>
<main>
<section id="home" class="v"></section>
<section id="learn" class="v" hidden><div id="acad"></div><div id="jour" hidden></div>
<div id="les" hidden><h2 id="lt" style="margin-top:0"></h2><div class="mut" id="ls"></div><div class="bar" style="max-width:520px;margin:6px 0"><i id="lp"></i></div><p id="lx"></p><div id="lb" class="board"></div><div id="lc" class="coach"></div><div class="row"><button class="b" id="lnext" hidden onclick="nextL()">Next lesson →</button></div></div></section>
<section id="play" class="v" hidden><div id="bots"></div>
<div id="game" hidden><div class="coach" id="ptop"></div><div id="pb" class="board"></div><div id="pc" class="coach"></div><div id="pw" class="warn"></div>
<div class="row"><button class="s" onclick="undo()">↩ Undo</button><button class="s" onclick="hint()">💡 Hint</button><button class="s" id="rs" onclick="resign()">🏳 Resign</button><button class="s" onclick="play(S.i,S.c)">↻ Restart</button></div><div class="mv" id="mv"></div></div></section>
<section id="puz" class="v" hidden><div id="plist"></div>
<div id="pz" hidden><h2 id="pt" style="margin-top:0"></h2><p id="pq"></p><div id="zb" class="board"></div><div id="zc" class="coach"></div>
<div class="row"><button class="s" onclick="zhint()">💡 Hint</button><button class="s" onclick="zsol()">👁 Solution</button><button class="b" id="znext" hidden onclick="zNext()">Next puzzle →</button></div></div></section>
<section id="me" class="v" hidden></section>
<footer>♞ Chess World — Every Move Begins an Adventure. Progress is saved on this device.</footer></main>

function ev(g){let s=0;g.board().forEach((row,r)=>row.forEach((p,c)=>{if(!p)return;let v=V[p.type]+(p.type!="k"&&r>1&&r<6&&c>1&&c<6?10:0)+(p.type=="p"?(p.color=="w"?6-r:r-1)*4:0);s+=p.color=="w"?v:-v}));return g.turn()=="w"?s:-s}
function nm(g,d,a,b){if(g.in_checkmate())return -1e5-d;if(g.in_draw())return 0;if(!d)return ev(g);
const ms=g.moves({verbose:true}).sort((x,y)=>(y.captured?1:0)-(x.captured?1:0));
for(const m of ms){g.move(m);const s=-nm(g,d-1,-b,-a);g.undo();if(s>a)a=s;if(a>=b)break}return a}
function pick(g,b){const ms=g.moves({verbose:true});if(!b.d||Math.random()<b.e)return ms[Math.random()*ms.length|0];
ms.sort(()=>Math.random()-.5).sort((x,y)=>(y.captured?1:0)-(x.captured?1:0));let a=-1e9,best=ms[0];
for(const m of ms){g.move(m);const s=-nm(g,b.d-1,-1e9,-a);g.undo();if(s>a){a=s;best=m}}return best}
function loss(g,m){g.undo();let best=-1e9,mine=0;for(const x of g.moves({verbose:true})){g.move(x);const s=-nm(g,2,-1e9,1e9);g.undo();if(s>best)best=s;if(x.from==m.from&&x.to==m.to)mine=s}
g.move({from:m.from,to:m.to,promotion:m.promotion});return best-mine}

function win(g,n){const chk=n>=3;for(const m of g.moves({verbose:true})){if(chk&&!/[+#]/.test(m.san))continue;g.move(m);const ok=g.in_checkmate()||(n>1&&!g.game_over()&&allr(g,n-1));g.undo();if(ok)return true}return false}
function allr(g,n){for(const m of g.moves({verbose:true})){g.move(m);const ok=win(g,n);g.undo();if(!ok)return false}return true}
function defend(g,n){let best=null,bk=0;for(const r of g.moves({verbose:true})){g.move(r);let k=1;while(k<n&&!win(g,k))k++;g.undo();if(k>bk){bk=k;best=r}}return[best,bk]}

function zsol(){P.skip[Z.i]=1;save();Z.sel=null;Z.star=Z.s[0].slice(2,4);draw(Z);const t=new Chess(PZ[Z.i][0]),f=t.move({from:Z.s[0].slice(0,2),to:Z.s[0].slice(2,4),promotion:Z.s[0][4]});say("#zc","The key move is <b>"+f.san+"</b> (to the ★). Study it, then try again — or move on.");$("#znext").hidden=Z.i>=149;$("#znext").textContent="Skip to next →"}
