:root{--bp:#FFD6E7;--cc:#FFB6D5;--lv:#DCCBFF;--cr:#FFF7ED;--pe:#FFCBA4;--pp:#BFA7FF;--rp:#FF80AB;--ink:#6b2d5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd6e7;color:var(--ink);font-family:Fredoka,Quicksand,Nunito,"Baloo 2",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:500;user-select:none}
#c{position:fixed;left:0;top:0;touch-action:none}
#ui{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));overflow:auto;overflow-x:hidden;text-align:center;scrollbar-width:none}
#ui>:first-child{margin-top:auto}#ui>:last-child{margin-bottom:auto}
#ui.home>:first-child,#ui.tpv>:first-child,#ui.ts>:first-child,#ui.bs>:first-child{margin-top:0}
#ui.tpv>.sheet{margin:auto 0 0}
h1,h2,p{margin:0}h2{font-weight:700;font-size:26px;text-shadow:0 2px 0 #fff8}p{line-height:1.5}small{opacity:.8}
.ttl{font-size:clamp(38px,10.5vw,66px);font-weight:700;line-height:1.05;color:#fff;text-shadow:0 3px 0 #ff80ab,0 6px 0 #e0558c,0 11px 18px rgba(107,45,92,.35)}
.ttl2{font-size:clamp(24px,6.5vw,34px);font-weight:700;line-height:1.1;color:#fff;text-shadow:0 3px 0 #ff80ab,0 6px 12px rgba(107,45,92,.3)}
.sub{font-weight:700;font-size:18px;text-shadow:0 2px 0 #fff9}.hero{display:flex;flex-direction:column;gap:6px;align-items:center}
.em{font-size:56px;animation:bn 1.8s ease-in-out infinite}.mc{width:140px;height:auto;animation:bn 2.2s ease-in-out infinite}
.pn{background:rgba(255,247,237,.84);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:3px solid #fff;border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:min(100%,460px);box-shadow:0 12px 30px rgba(224,85,140,.28);animation:pop .4s}
.b{border:0;border-bottom:5px solid #e0558c;border-radius:999px;padding:11px 24px;font-weight:700;font-size:18px;font-family:inherit;letter-spacing:.3px;background:linear-gradient(#ff9ec5,#ff80ab);color:#fff;text-shadow:0 2px 0 rgba(160,40,100,.4);cursor:pointer;transition:transform .15s;box-shadow:0 8px 16px rgba(224,85,140,.3)}
.b:hover{transform:translateY(-2px) scale(1.04)}.b:active{transform:translateY(3px);border-bottom-width:2px}
.b.g{background:#fff;color:#8a4fb0;text-shadow:none;border-bottom-color:#dccbff;font-size:15px;padding:9px 16px;box-shadow:0 6px 12px rgba(191,167,255,.35)}
.b.pk{animation:bn 1.9s ease-in-out infinite}.b.big{font-size:24px;padding:14px 46px}.b.on{box-shadow:0 0 0 3px #ffb6d5}.b[disabled]{opacity:.65;transform:none;cursor:default;animation:none}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;width:min(100%,780px)}
.chip{background:rgba(255,255,255,.8);border:2px solid #fff;color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 4px 10px rgba(224,85,140,.2)}
.tag{background:linear-gradient(90deg,#ffcba4,#ff9ec5);color:#6b2d5c;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.75);border:2px solid #fff;border-radius:999px;padding:4px;width:min(100%,380px)}
.seg button{flex:1;border:0;border-radius:999px;padding:8px 6px;font:inherit;font-weight:700;font-size:15px;background:transparent;color:var(--ink);cursor:pointer;line-height:1.15}
.seg small{display:block;font-size:11px}.seg .on{background:#ff80ab;color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,340px)}
.tile{background:rgba(255,255,255,.8);border:2px solid #fff;border-radius:22px;padding:10px 4px;color:var(--ink);font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;transition:transform .15s;box-shadow:0 6px 12px rgba(191,167,255,.35)}
.tile i{font-style:normal;font-size:26px}.tile:hover{transform:translateY(-3px)}.tile:active{transform:scale(.95)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(100%,780px)}
.ms{column-count:2;column-gap:12px;width:min(100%,780px)}@media(min-width:720px){.ms{column-count:3}}
.cd{background:rgba(255,247,237,.86);border:3px solid #fff;border-radius:24px;padding:8px;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 8px 18px rgba(224,85,140,.2)}
.ms .cd{break-inside:avoid;margin-bottom:12px}.cd .b{width:100%;padding:8px 10px;font-size:15px}.cd.lock{opacity:.55}
.ph{position:relative;width:100%}.ph canvas{width:100%;display:block;border-radius:18px;cursor:pointer}
.pr{position:absolute;top:8px;right:8px;background:#ff80ab;color:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}.pr.ok{background:#8fe3bd;color:#1f5a41}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}.st div{background:rgba(220,203,255,.5);border-radius:18px;padding:8px 12px}.st span{font-size:22px}.st b{display:block;font-size:22px}
.av{width:76px;height:76px;border-radius:50%;background:linear-gradient(#ffcba4,#ff9ec5);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 6px 0 #e0558c}
.sheet{width:min(100%,520px)}.unl{animation:unl .9s}.bump{animation:pop .4s}
input{font:inherit;font-weight:700;font-size:18px;padding:12px 16px;border-radius:999px;border:3px solid #ffb6d5;text-align:center;width:min(280px,80vw);color:var(--ink);background:#fff}
.ld{width:200px;height:12px;background:#fff8;border-radius:9px;overflow:hidden}.ld i{display:block;height:100%;background:linear-gradient(90deg,#ffb6d5,#bfa7ff);animation:ld 1s forwards}
#pb{position:fixed;right:10px;top:80px;width:52px;height:48px;border:0;background:none;padding:0;display:none;cursor:pointer;filter:drop-shadow(0 4px 6px rgba(224,85,140,.4));transition:transform .15s}#pb:active{transform:scale(.9)}#pb:hover{transform:scale(1.08)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#ff80ab,#bfa7ff);color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;z-index:9;max-width:92vw;text-align:center;box-shadow:0 6px 16px rgba(107,45,92,.3)}#toast.on{animation:tt 2.6s}
#md{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(107,45,92,.45);display:none;align-items:center;justify-content:center;z-index:8}#md.show{display:flex}
.cf{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:7}.cf i{position:absolute;top:-40px;font-style:normal;animation:fl 3.2s linear infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
